name: PKIX Error Validation

on:
  workflow_dispatch:  # Manual trigger only
  push:
    paths:
      - 'k8s/scripts/trigger-pkix-error.sh'
      - 'k8s/scripts/reproduce-pkix-error.sh'
      - 'docs/PKIX_*.md'

jobs:
  validate-pkix-error-reproduction:
    name: Validate PKIX Error Can Be Reproduced
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Minikube
      uses: medyagh/setup-minikube@latest
      with:
        kubernetes-version: 'v1.28.0'
        driver: docker

    - name: Verify Minikube
      run: |
        kubectl cluster-info
        kubectl get nodes

    - name: Install OpenSSL and keytool
      run: |
        sudo apt-get update
        sudo apt-get install -y openssl openjdk-17-jdk-headless

    - name: Build Maven artifacts
      run: |
        mvn clean package -DskipTests
        ls -lh app-a/target/*.jar
        ls -lh app-b/target/*.jar

    - name: Deploy complete working infrastructure
      run: |
        cd k8s/scripts
        bash deploy.sh

    - name: Wait for all pods to be ready
      run: |
        kubectl wait --for=condition=ready pod -l app=vault --timeout=120s
        kubectl wait --for=condition=ready pod -l app=app-a --timeout=180s
        kubectl wait --for=condition=ready pod -l app=app-b --timeout=180s

    - name: Verify working configuration (no PKIX errors)
      run: |
        cd k8s/scripts
        bash verify-no-pkix-error.sh

    - name: Test 1 - Reproduce PKIX error with empty truststore
      run: |
        echo "=========================================="
        echo "Reproducing PKIX Error (Empty Truststore)"
        echo "=========================================="

        # Get Vault pod
        VAULT_POD=$(kubectl get pod -l app=vault -o jsonpath="{.items[0].metadata.name}")

        # Create empty truststore
        mkdir -p /tmp/pkix-ci-test
        cd /tmp/pkix-ci-test

        keytool -genkeypair -alias dummy -keyalg RSA -keysize 2048 \
          -keystore empty-truststore.jks -storepass changeit \
          -dname "CN=Dummy" -validity 1

        keytool -delete -alias dummy \
          -keystore empty-truststore.jks -storepass changeit

        echo "Created empty truststore:"
        keytool -list -keystore empty-truststore.jks -storepass changeit -storetype JKS

        # Upload to Vault
        kubectl cp empty-truststore.jks "${VAULT_POD}:/tmp/empty-truststore.jks"
        kubectl exec $VAULT_POD -- sh -c "base64 -w 0 /tmp/empty-truststore.jks > /tmp/empty-truststore.b64"

        kubectl exec $VAULT_POD -- sh -c '
          export VAULT_TOKEN=root
          EMPTY_TRUST=$(cat /tmp/empty-truststore.b64)
          vault kv patch secret/app-a ssl.truststore="$EMPTY_TRUST"
        '

        echo "✓ Empty truststore uploaded to Vault"

        # Restart App A
        kubectl rollout restart deployment/app-a
        kubectl rollout status deployment/app-a --timeout=120s

        # Wait for app to start
        sleep 30

        APP_A_POD=$(kubectl get pod -l app=app-a -o jsonpath="{.items[0].metadata.name}")

        # Verify empty truststore is loaded
        echo "Verifying empty truststore in App A:"
        kubectl exec $APP_A_POD -- keytool -list \
          -keystore /etc/security/ssl/truststore.jks \
          -storepass changeit -storetype JKS || true

        # Attempt connection (should fail)
        echo "Attempting mTLS connection (expecting failure)..."
        set +e
        kubectl exec $APP_A_POD -- curl -k --max-time 10 \
          --cert /etc/security/ssl/app-a-keystore.p12:changeit \
          --cert-type P12 \
          https://app-b.default.svc.cluster.local:8443/health 2>&1
        CURL_EXIT=$?
        set -e

        if [ $CURL_EXIT -eq 0 ]; then
          echo "❌ FAIL: Connection succeeded when it should have failed"
          exit 1
        fi

        echo "✓ Connection failed as expected (PKIX error triggered)"

        # Check logs for PKIX error
        echo "Checking logs for PKIX error..."
        PKIX_LOG=$(kubectl logs $APP_A_POD --tail=200 | grep -i "pkix\|certpath" || echo "")

        if [ -n "$PKIX_LOG" ]; then
          echo "✓ PKIX error found in logs:"
          echo "$PKIX_LOG"
        else
          echo "⚠️  PKIX error not in logs yet (may appear later)"
        fi

    - name: Test 2 - Restore working configuration
      run: |
        echo "=========================================="
        echo "Restoring Working Configuration"
        echo "=========================================="

        VAULT_POD=$(kubectl get pod -l app=vault -o jsonpath="{.items[0].metadata.name}")

        # Re-upload correct truststore
        kubectl cp k8s/certs/truststore.jks "${VAULT_POD}:/tmp/truststore.jks"
        kubectl exec $VAULT_POD -- sh -c "base64 -w 0 /tmp/truststore.jks > /tmp/truststore.b64"

        kubectl exec $VAULT_POD -- sh -c '
          export VAULT_TOKEN=root
          TRUST=$(cat /tmp/truststore.b64)
          vault kv patch secret/app-a ssl.truststore="$TRUST"
        '

        echo "✓ Correct truststore restored in Vault"

        # Restart App A
        kubectl rollout restart deployment/app-a
        kubectl rollout status deployment/app-a --timeout=120s

        sleep 30

        APP_A_POD=$(kubectl get pod -l app=app-a -o jsonpath="{.items[0].metadata.name}")

        # Verify truststore contains CA
        echo "Verifying truststore contains CA:"
        kubectl exec $APP_A_POD -- keytool -list \
          -keystore /etc/security/ssl/truststore.jks \
          -storepass changeit -storetype JKS | grep "ca,"

        # Test communication (should work)
        echo "Testing mTLS communication (expecting success)..."
        RESPONSE=$(kubectl exec $APP_A_POD -- curl -k --fail --silent \
          --cert /etc/security/ssl/app-a-keystore.p12:changeit \
          --cert-type P12 \
          https://app-b.default.svc.cluster.local:8443/health)

        if echo "$RESPONSE" | grep -q "UP"; then
          echo "✓ Communication restored successfully: $RESPONSE"
        else
          echo "❌ FAIL: Communication still broken"
          exit 1
        fi

    - name: Final verification - No PKIX errors
      run: |
        cd k8s/scripts
        bash verify-no-pkix-error.sh

    - name: Collect logs on failure
      if: failure()
      run: |
        echo "=========================================="
        echo "Collecting logs for debugging"
        echo "=========================================="
        kubectl get pods -A
        kubectl logs -l app=vault --tail=100 || true
        kubectl logs -l app=app-a --tail=200 || true
        kubectl logs -l app=app-b --tail=200 || true
        kubectl describe pod -l app=app-a || true

    - name: Summary
      if: success()
      run: |
        echo "=========================================="
        echo "✅ PKIX Error Validation Complete"
        echo "=========================================="
        echo ""
        echo "Validated:"
        echo "  ✓ Working configuration (no PKIX errors)"
        echo "  ✓ Empty truststore triggers PKIX error"
        echo "  ✓ Restoring truststore fixes the error"
        echo "  ✓ Final state: all communication working"
        echo ""
        echo "This confirms:"
        echo "  1. PKIX error can be reliably reproduced"
        echo "  2. The error is caused by missing CA in truststore"
        echo "  3. The solution (shared CA + truststore) works"
        echo ""
